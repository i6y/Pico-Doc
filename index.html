<title>PICO-OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg: #000;
  --fg: #d0d0d0;
  --dim: #7a7a7a;
  --sky: #5ec8ff;
  --pico: rgb(0, 0, 200);
  --prompt: #4ade80;
  --warn: #ff6b81;
  --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
.screen { max-width: 90ch; min-width: 0; outline: none; padding-bottom: 32px; }
.ln { white-space: pre-wrap; word-break: break-word; min-height: 1.6em; }
.dim { color: var(--dim); }
.ok { color: var(--prompt); }
.warn { color: var(--warn); }
.sky { color: var(--sky); }
.cursor {
  display: inline-block; width: .6em; height: 1.15em;
  background: var(--sky); vertical-align: -0.2em;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.blink-us { color: var(--sky); animation: blink 1s steps(1) infinite; }
.badge { color: var(--sky); font-weight: 700; }
.banner { display: none; }

.menu { list-style: none; margin: 8px 0 0; padding: 0; }
.menu button {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: block; padding-left: 4ch;
  font-family: var(--mono); font-size: 14px; line-height: 1.6;
  color: var(--fg);
}
.menu button::before { content: "  "; white-space: pre; }
.menu button.sel { color: var(--sky); }
.menu button.red { color: var(--warn); }
.menu button.red.sel { color: var(--warn); text-decoration: underline; text-underline-offset: 3px; }
.menu button.sel::before { content: "> "; }
.menu button:focus-visible { outline: 1px dotted var(--sky); }
.hint { margin-top: 16px; color: var(--dim); }
kbd { font-family: var(--mono); }

.h { color: var(--sky); margin-top: 16px; }
.kv { display: grid; grid-template-columns: 0 15ch 1fr; margin-top: 4px; }
.kv > div { min-width: 0; }
.kv .k { color: var(--dim); grid-column: 2; }
.kv .k + div { grid-column: 3; }
.swatch.red { background: rgb(200, 40, 40); }
:root.now { --sky: rgb(200, 40, 40); }
.swatch { display: inline-block; width: .9em; height: .9em; background: var(--pico); vertical-align: -0.1em; margin-right: 6px; }
.item { margin-top: 8px; }
.item .d { color: var(--dim); display: block; }
.item.bad b { color: var(--warn); }
.item b { font-weight: 400; }
.pov, .note { max-width: 70ch; }
.pov { font-style: italic; }
.pov p, .note p { margin: 8px 0; }
figure { margin: 8px 0 0; }
figure + figure { margin-top: 24px; }
figure img { display: block; max-width: 100%; height: auto; max-height: 80vh; width: auto; }
figcaption { color: var(--dim); margin-top: 4px; }
.term { margin-top: 4px; overflow-x: auto; }
.term .ln { white-space: pre; word-break: normal; }
.back { margin-top: 20px; }

@media (max-width: 480px) {
  .kv { grid-template-columns: 0 1fr; }
  .kv .k, .kv .k + div { grid-column: 2; }
  .kv .k { margin-top: 4px; }
  .menu button { padding-left: 2ch; }
}
@media (prefers-reduced-motion: reduce) { .cursor, .blink-us { animation: none; } }
</style>

        { id: "abilities", file: "Abilities.txt", body: `
          <div class="h">Strengths</div>
          <div class="item"><b>[+] Quick thinking</b><span class="d">When something urgent comes up, Pico can quickly offer or carry out a good solution.</span></div>
          <div class="item"><b>[+] Advanced neural network</b><span class="d">As a first prototype from before the mass-produced drones, his logic works differently. He changes his approach to fit each obstacle, learns from every attempt, and picks up skills quickly.</span></div>
          <div class="item"><b>[+] Technical mind</b><span class="d">He landed with some built-in knowledge of his own inner workings and self-repair, which gives him useful latent knowledge of electronics and components.</span></div>

          <div class="h">Backstory · Pico's POV</div>
          <div class="pov">
            <p>I am an experimental robot. I was one of the first robots ever sent out to Copper-9, and am probably the only one of that generation still online today. I have been online for approximately 5 years.</p>
            <p>My form possesses absolutely nothing besides a mechanical body of weak servos, outer plates, and steel sinew.</p>
            <p>I was here before the production models, and the colonies and societies they formed. I was able to see the lonely, abandoned city in all its frigid goodness.</p>
            <p>I was given no explicit purpose, besides one word in my contextual knowledge, which seemed like some sort of order: “live”.<br>How peculiar.</p>

            <p>I learn more about the world every day. Recently, I've decided to be a bit more brave when going out. I've made a friend named Arabella, and am soon to join my first colony. I am worried they will see me differently. I do look different, after all..</p>
          </div>

            <p>They meant to disable him before sending out the production models. Something in between severed the data stream between Pico and JCJenson's satellites, so they could no longer get any info from him. They decided it would be fine to let him be.</p>
            <p>Other models like Pico were sent out, but they were all disabled.</p>
            <p>Disassembly drones don't really target or kill Pico because they don't know what he is.</p>

        { id: "equipment", file: "Equipment.txt", body: `
          <div class="h">Equipment</div>
          <div class="item"><b>[+] High-voltage focused electron beams</b><span class="d">One in each forearm, built with materials from two old CRT televisions. They can pierce through almost all types of armor because of the nature of the projectile. Electrons are massless, charged particles. They stun enemies for a short period of time (Roll a 6-sided die. If the dice rolls from 1-5, the enemy is stunned for a few seconds and their most recent action is cancelled. 1-2 allows Pico to close in and attack once, and 3-5 allows Pico to close in and attack twice or some other long action. 6 stuns the opponent for the entire turn).<br>The reason this is a guaranteed hit mechanic and not a probability mechanic is that Pico is a robot, with robotic levels of precision, and it would be very hard for him to miss. Additionally, electron beams are impossible to dodge, because they are virtually invisible and travel anywhere from 0.3x to 0.9x the speed of light.</span></div>

          <div class="item"><b>[+] Upgraded logic chip and memory</b><span class="d">Plus a marginally higher clock speed.</span></div>
          <div class="item"><b>[+] Converted oil system</b><span class="d">Works with many types of oil and grease. Power now comes from a recharging system, so oil mainly handles internal lubrication and cooling. In an emergency, oil can still work as a power source.</span></div>
          <div class="item"><b>[+] PWM microcontroller and radio</b><span class="d">An inbuilt radio transmitter and receiver with his own proprietary data protocol. He can slide into your DMs from over yonder and anywhere.</span></div>
          <div class="item"><b>[+] Steel cables and heavy-duty servos</b><span class="d">Built to handle high loads.</span></div>
          <div class="item"><b>[+] Power supply</b><span class="d">With all the power this setup eats, Pico has a power supply to match. It makes sense for this era of the universe.</span></div>` },
        { id: "abilities", file: "Abilities.txt", body: `
          <div class="h">Abilities</div>
          <div class="item"><b>[+] Sandevistan</b><span class="d">A self-made chip in his head, near his logic chips. It severely overclocks his hardware, so he can think, move and react several times faster than normal. And he already moves pretty fast.</span></div>
          <div class="item"><b>[+] Electron beams</b><span class="d">The beam in each arm does electrical damage depending on how well the target can deflect or sustain it. Most drones can't, especially at the amount Pico puts out. Tiny servos on each lens fine-tune the beam's path so he can hit weak spots. They stun enemies for a short period of time (Roll a 6-sided die. If the dice rolls from 1-5, the enemy is stunned for a few seconds and their most recent action is cancelled. 1-2 allows Pico to close in and attack once, and 3-5 allows Pico to close in and attack twice or some other long action. 6 stuns the opponent for the entire turn).<br>The reason this is a guaranteed hit mechanic and not a probability mechanic is that Pico is a robot, with robotic levels of precision, and it would be very hard for him to miss. Additionally, electron beams are impossible to dodge, because they are virtually invisible and travel anywhere from 0.3x to 0.9x the speed of light.</span></div>
          <div class="item"><b>[+] Diamond-tipped claws</b><span class="d">Machined from tungsten carbide.</span></div>
          <div class="item"><b>[+] Quick healing</b><span class="d">Pico can zap-weld major wounds shut.</span></div>
          <div class="h">General strengths</div>
          <div class="item"><b>[+] Extensive combat knowledge and quick reaction time</b></div>
          <div class="item"><b>[+] Technical mind</b><span class="d">He can build, mod and improve himself, and possibly companions.</span></div>
          <div class="item"><b>[+] A little resistant to incoming electron beams</b><span class="d">A result of his own idiocy. He supposedly messed around and found out.</span></div>
          <div class="item"><b>[+] Very friendly</b></div>
          <div class="item"><b>[?] Cat-like in nature</b><span class="d">Is this really a strength?</span></div>
          <div class="h">Skills</div>
          <div class="kv">
            <div class="k">Solver skills</div><div>N/A</div>
            <div class="k">Welding</div><div>Yes</div>
            <div class="k">Firmware</div><div>Can program and flash most drone hardware, both production and third-party</div>
          </div>
          <div class="h">Weaknesses</div>
          <div class="item bad"><b>[-] Overthinking</b><span class="d">His sanity has a limit. If an opponent keeps him anticipating and guessing for too long, he gets over-paranoid and dives into deep analysis of what they could do and what will happen next, like a high-rated chess engine. His responses slow down, and sometimes he has to take a compromise because he was busy thinking instead of doing. He once had to take one of Null's hits because he was too busy taking in Arabella's situation at the same time.</span></div>
          <div class="item bad"><b>[-] Heat</b><span class="d">He has no idea how to make his structure more resistant to high-temperature attacks. His outer frame is a tungsten carbide derivative coated in a non-conductive material.</span></div>
          <div class="item bad"><b>[-] Self-inflicted strain</b><span class="d">Some of his attacks put incredible stress on his body and can exceed the rated tension of his cables, even with the steel cables and new servos. If he dropkicks an opponent and tries to annihilate them in that one strike, he can end up with "super arthritis": serious servo and joint damage.</span></div>` },
        { id: "lore", file: "Lore.txt", body: `
          <div class="h">Current lore</div>
          <div class="pov">
            <p>Right now, Pico runs a workshop in the abandoned city, in the corner of an intersection between two streets. At first glance, it's a garage door with lots of graffiti. At second glance, there's music coming from it, and lots of lights bleeding through from the gap between the door and the street.</p>
            <p>Once you enter, you'll see tons of skateboards hung up, an old boombox hooked up to a computer most likely playing Alice In Chains, Creed, or Staind, and several boxes of high-end hardware. There's one bright red mechanic's cabinet, the drawers labeled with masking tape: "HARDWARE" "CUSTOM" "PROJECTS" "SANDEVISTAN DEVELOPMENT"</p>
            <p>And then you'll see the custom visors with RGB graphics and various glowing drone parts on one table.</p>
            <p>And then you'll see Pico himself, with a red display under his visor, most likely welding something. He'll notice someone new has entered and he'll wave vigorously at you.</p>
            <p>Occasionally, drones from surrounding colonies drop by and ask him for something, whether it be some sort of resource or even a repair job. Pico doesn't get guests or customers often, but he loves it when he does.</p>
          </div>
          <div class="h">Backstory · Pico's POV</div>
          <div class="pov">
            <p>My story started, like many others, as an experimental drone. I was one of the first ones out there, the only one of that generation still online today.</p>
            <p>I was given no explicit purpose, besides a mission of one word: “live”.<br>How peculiar.</p>
            <p>I wandered on this desolate, abandoned planet, as a weak robot, knowing nothing with given only minimal hardware, a self-aware and self-governing AI, and some cat-like instincts.</p>
            <p>As I discovered colonies and other things, I was taken in by a small family.</p>
            <p>......soon watched that family get disassembled by a group of three yellow-eyed drones.</p>
            <p>.. began to hate myself. Hate the cage I was trapped in, the frail mechanical limbs which bound my soul. I wished I could have done something.</p>
            <p>As years passed, I watched everyone I’d grown to know drop off from one cause or the other, whether a disaster or a disassembly drone.</p>
            <p>At the end of the day, I was as lost as I was when I had begun. I wanted only one thing: closure, or resolution, which I thought could only be achieved with death.</p>
            <p><b>But!</b> Death was the only thing I could not have! My objective is “live”, so at all costs I can’t die!</p>
            <p>What is there left for me to do?</p>
            <p>Exploring and wandering. I stay in a skyscraper, in the snowy abandoned city.</p>
            <p>I learnt about machinery and drone systems. I experimented on myself, modded myself, made myself as good as I could be with the materials available. I’m still a robot.</p>
            <p>Even today, I roam the snowy streets. Although, for some reason, I hate a little bit less now. Now, instead of dreading every day, I just walk the streets and look up at the sky.</p>
            <p>I’ve accepted the permanence in my solitude. I’ve accepted I probably won’t be able to even exit the orbit of Copper-9. I’ve accepted I am stuck here with all the colonies. It’s okay. I’ll just look at the stars and dream on. I was at least allowed to dream.</p>
            <p>Sometimes, when there’s a new adversary, I study them from a distance to learn how they work, and gauge if they’re a threat. I haven’t had to fight any major forces recently, but there have been a few formidable drones here and there that have come after me.</p>
            <p>..........</p>
            <p>At least my hideout has Christmas lights.</p>
          </div>` },
        { id: "wife", file: "wife.sh", track: "srk.mp3", body: `
          <figure>
            <img src="${IMG_W1}" alt="Pico with red visor eyes and Arabella with purple visor eyes sitting on a couch, music playing from afar" width="1100" height="888">

  };

  let profile = "early";
  const P = () => PROFILES[profile];
  function line(html, cls = "") {
    const d = document.createElement("div");
    d.className = "ln " + cls;
    d.innerHTML = html;
    screen.appendChild(d);
    return d;
  }
  async function typeCmd(cmd, id) {
    const d = line(PROMPT + '<span class="t"></span><span class="cursor"></span>');
    const t = d.querySelector(".t");
    for (const ch of cmd) {
      if (id !== run) return false;
      t.textContent += ch;
      await sleep(28 + Math.random() * 30);
    }
    await sleep(160);
    d.querySelector(".cursor").remove();
    return id === run;
  }
  async function reveal(nodes, id, gap = 40) {
    for (const n of nodes) {
      if (id !== run) return false;
      screen.appendChild(n);
      await sleep(gap);
    }
    return true;
  }
  function frag(html) {
    const t = document.createElement("template");
    t.innerHTML = html.trim();
    return [...t.content.children];
  }
  let sel = 0;
  let opt = 0;
  let mode = "boot";
  const music = new Audio("track.mp3");
  music.loop = true;
  music.preload = "auto";
  let userPaused = false;
  const musicIndex = () => P().sections.length + 1;
  const isMusicToggle = e => !!e && ((e.target && e.target.closest && e.target.closest("#opt-music")) ||
    (e.type === "keydown" && e.key === " " && (mode === "menu" || mode === "section")) ||
    (e.type === "keydown" && mode === "section" && e.key === "Enter" && opt === 1) ||
    (e.type === "keydown" && mode === "menu" && (e.key === "Enter" || e.key === "ArrowRight") && sel === musicIndex()));
  const tryPlay = e => { if (isMusicToggle(e)) return; if (!userPaused && music.paused) music.play().catch(() => {}); };
  tryPlay();
  ["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, tryPlay, { capture: true }));
  function toggleMusic() {
    if (music.paused) { userPaused = false; music.play().catch(() => {}); }
    else { userPaused = true; music.pause(); }
  }
  const musicLabel = () => (music.paused ? "Play_Music.sh" : "Pause_Music.sh");
  function syncMusicBtn() { const b = document.getElementById("opt-music"); if (b) b.textContent = musicLabel(); }
  music.addEventListener("play", syncMusicBtn);
  music.addEventListener("pause", syncMusicBtn);

  function applyProfile() {
    document.documentElement.classList.toggle("now", profile === "now");
    setTrack(P().track);
  }
  const resumeAt = {};
  function setTrack(src) {
    const cur = music.src.split("/").pop();
    if (cur === src) return;
    if (cur) resumeAt[cur] = music.currentTime;
    music.src = src;
    const t = resumeAt[src];
    if (t) music.addEventListener("loadedmetadata", () => { music.currentTime = t; }, { once: true });
    if (!userPaused) music.play().catch(() => {});
  }
  async function boot(withCursor) {
    const id = ++run;
    mode = "boot";
    sel = 0;
    screen.innerHTML = "";
    if (withCursor) {
      const c = line('<span class="cursor"></span>');
      await sleep(1400);
      if (id !== run) return;
      c.remove();
    }
    if (!(await reveal(frag(P().boot), id, 120))) return;
    showMenu();
  }

  function showMenu() {
    mode = "menu";
    const p = P();
    const items = [
      ...p.sections.map((s, i) => ({ label: s.file, act: () => openSection(i) })),
      { label: p.jump.label, cls: "red", act: jump },
      { label: musicLabel(), id: "opt-music", act: toggleMusic },
    ];
    const ul = document.createElement("ul");
    ul.className = "menu";
    ul.setAttribute("role", "menu");
    items.forEach((it, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.id = it.id || "opt-" + profile + "-" + i;
      b.textContent = it.label;
      if (it.cls) b.classList.add(it.cls);
      b.setAttribute("role", "menuitem");
      b.addEventListener("mouseenter", () => setSel(i));
      b.addEventListener("click", it.act);
      b._act = it.act;
      li.appendChild(b);
      ul.appendChild(li);
    });
    screen.appendChild(ul);
    screen.appendChild(frag(`<div class="hint"><kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>Enter</kbd> open · <kbd>Esc</kbd> back · or tap an option</div>`)[0]);
    setSel(sel);
    screen.focus({ preventScroll: true });
  }
  function menuButtons() { return [...screen.querySelectorAll(".menu button")]; }
  function setSel(i) {
    const btns = menuButtons();
    if (!btns.length) return;
    sel = (i + btns.length) % btns.length;
    btns.forEach((b, j) => b.classList.toggle("sel", j === sel));
  }
  function setOpt(i) {
    const btns = [...screen.querySelectorAll(".back button")];
    if (!btns.length) return;
    opt = (i + btns.length) % btns.length;
    btns.forEach((b, j) => b.classList.toggle("sel", j === opt));
  }

  async function jump() {
    if (mode !== "menu") return;
    const id = ++run;
    mode = "busy";
    screen.innerHTML = "";
    const ok = await typeCmd(P().jump.cmd, id);
    if (!ok) return;
    profile = P().jump.to;
    applyProfile();
    await sleep(250);
    if (id !== run) return;
    boot(false);
  }

  async function openSection(i) {
    if (mode !== "menu") return;
    sel = i;
    const s = P().sections[i];
    const id = ++run;
    mode = "busy";
    screen.innerHTML = "";
    setTrack(s.track || P().track);
    const ok = await typeCmd((s.file.endsWith(".sh") ? "./" : "cat ") + s.file, id);
    if (!ok) return;
    if (!(await reveal(frag(s.body), id, 60))) return;
    const back = frag(`<ul class="menu back"><li><button id="opt-back">Back_to_Menu.sh</button></li><li><button id="opt-music">${musicLabel()}</button></li></ul>`)[0];
    const btns = back.querySelectorAll("button");
    btns[0].addEventListener("click", goBack);
    btns[1].addEventListener("click", toggleMusic);
    btns.forEach((b, j) => b.addEventListener("mouseenter", () => setOpt(j)));
    screen.appendChild(back);
    setOpt(0);
    mode = "section";
    screen.focus({ preventScroll: true });
  }

  async function goBack() {
    if (mode !== "section") return;
    const id = ++run;
    mode = "busy";
    screen.innerHTML = "";
    setTrack(P().track);
    const ok = await typeCmd(P().menuCmd, id);
    if (!ok) return;
    screen.appendChild(frag(P().header)[0]);
    showMenu();
  }

  document.addEventListener("keydown", e => {
    if (mode === "menu") {
      const btns = menuButtons();
      if (e.key === "ArrowDown") { e.preventDefault(); setSel(sel + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setSel(sel - 1); }
      else if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); btns[sel] && btns[sel]._act(); }
      else if (e.key === " ") { e.preventDefault(); toggleMusic(); }
      else if (/^[1-9]$/.test(e.key) && +e.key <= P().sections.length) { openSection(+e.key - 1); }
    } else if (mode === "section") {
      if (e.key === "ArrowDown") { e.preventDefault(); setOpt(opt + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setOpt(opt - 1); }
      else if (e.key === "Enter") { e.preventDefault(); opt === 1 ? toggleMusic() : goBack(); }
      else if (e.key === " ") { e.preventDefault(); toggleMusic(); }
      else if (e.key === "Escape" || e.key === "Backspace" || e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
    }
  });
  screen.addEventListener("click", e => { if (!e.target.closest("button,a,img")) screen.focus({ preventScroll: true }); });
  function gate() {
    mode = "gate";
    screen.innerHTML = "";
    line('press any key to boot<span class="blink-us">_</span>');
    const go = e => {
      if (mode !== "gate") return;
      if (e.type === "keydown" && ["Shift", "Control", "Alt", "Meta", "Tab"].includes(e.key)) return;
      if (e.type === "keydown") e.preventDefault();
      document.removeEventListener("keydown", go);
      document.removeEventListener("pointerdown", go);
      boot(true);
    };
    document.addEventListener("keydown", go);
    document.addEventListener("pointerdown", go);
    screen.focus({ preventScroll: true });
  }
  gate();
})();
</script>

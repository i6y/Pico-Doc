<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.dc.msg { display: grid; grid-template-columns: 4ch minmax(0, 1fr); column-gap: 1.5ch; padding: 6px 4px; border-radius: 4px; }
.dc.msg:hover { background: rgba(255, 255, 255, 0.03); }
.dc .num { grid-column: 1; grid-row: 2; justify-self: end; color: var(--dim); font-size: 11px; line-height: 22px; text-decoration: none; font-variant-numeric: tabular-nums; }
.dc .num:hover { color: var(--fg); text-decoration: underline; }
.dc .content { grid-column: 2; grid-row: 2; min-width: 0; display: grid; gap: 2px; }
.dc .reply { grid-column: 2; grid-row: 1; position: relative; display: flex; gap: 6px; align-items: baseline; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; min-width: 0; margin-bottom: 2px; }
.dc .reply::before { content: ""; position: absolute; left: -2.6ch; top: 9px; width: 2ch; height: 9px; border-left: 2px solid #3a3a3a; border-top: 2px solid #3a3a3a; border-top-left-radius: 6px; }
.dc .reply-who { color: var(--sky); flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.dc .reply-snippet { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dc .para { white-space: pre-wrap; overflow-wrap: anywhere; }
.dc .gap { height: 0.6em; }
.dc .subtext { color: var(--dim); font-size: 12px; white-space: pre-wrap; }
.dc .h1 { font-size: 20px; font-weight: 700; }
.dc .h2 { font-size: 17px; font-weight: 700; }
.dc .h3 { font-size: 15px; font-weight: 700; }
.dc ul.list { margin: 0; padding-left: 3ch; }
.dc ul.list li { overflow-wrap: anywhere; }
.dc ul.list li.nested { margin-left: 2ch; list-style-type: circle; }
.dc .quote { margin: 0; padding-left: 1.5ch; border-left: 3px solid #3a3a3a; display: grid; gap: 2px; }
.dc .empty { color: var(--dim); font-style: italic; font-size: 12px; }
.dc .link { color: var(--sky); overflow-wrap: anywhere; }
.dc .mention { color: var(--sky); background: rgba(255, 255, 255, 0.07); border-radius: 3px; padding: 0 2px; }
.dc .emoji { color: var(--dim); background: rgba(255, 255, 255, 0.05); border-radius: 3px; padding: 0 3px; font-size: 12px; }
.dc .inline-code { background: #16171a; border: 1px solid #2a2c31; border-radius: 3px; padding: 0 3px; }
.dc .spoiler { background: #222; color: transparent; border-radius: 3px; cursor: pointer; }
.dc .spoiler * { visibility: hidden; }
.dc .spoiler.shown { background: rgba(255, 255, 255, 0.08); color: inherit; }
.dc .spoiler.shown * { visibility: visible; }
.dc .codeblock { margin: 4px 0; padding: 7px 9px; background: #121316; border: 1px solid #2a2c31; border-radius: 4px; color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; font: 13.5px/18px var(--mono); }
.dc .codeblock .add { color: #a6d1ab; background: rgba(90, 170, 100, 0.10); }
.dc .codeblock .del { color: #f4afa9; background: rgba(220, 80, 80, 0.11); }
.dc .codeblock .meta { color: #8fc3de; }
.dc .codeblock .comment { color: #8a8c93; }
.zip-err { color: var(--warn); }
@media (max-width: 480px) {
  .dc.msg { grid-template-columns: 3ch minmax(0, 1fr); column-gap: 1ch; }
  .dc .reply::before { left: -1.8ch; width: 1.4ch; }
}
</style></head><body>

:root {
  --bg: #000;
  --fg: #d0d0d0;
  --dim: #7a7a7a;
  --sky: #5ec8ff;
  --pico: rgb(0, 0, 200);
  --prompt: #4ade80;
  --warn: #ff6b81;
  --mono: "Input Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { height: 100%; }
body {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
.screen {
  width: 100%;
  max-width: 90ch;
  min-width: 0;
  outline: none;
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  text-align: left;
}

.player {
  position: fixed;
  right: calc(14px + env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(290px, calc((100% - 28px) / 1.3));
  transform: scale(1.3);
  transform-origin: bottom right;

<script>
const DiscordRender = (() => {
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function safeUrl(u) {
    return /^https?:\/\//i.test(u) ? u : null;
  }

  function link(href, children) {
    const a = el("a", "link");
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    if (typeof children === "string") a.textContent = children;
    else a.append(...children);
    return a;
  }

  const INLINE = [
    { re: /\\([^0-9A-Za-z\s])/y, make: m => document.createTextNode(m[1]) },
    { re: /(`+)([\s\S]*?[^`])\1(?!`)/y, make: m => el("code", "inline-code", m[2].trim()) },
    { re: /<(a?):(\w+):(\d+)>/y, make: m => el("span", "emoji", ":" + m[2] + ":") },
    { re: /<@&(\d+)>/y, make: () => el("span", "mention", "@role") },
    { re: /<@!?(\d+)>/y, make: () => el("span", "mention", "@user") },
    { re: /<#(\d+)>/y, make: () => el("span", "mention", "# channel") },
    { re: /<t:(-?\d+)(?::[tTdDfFR])?>/y, make: m => el("span", "mention", new Date(+m[1] * 1000).toLocaleString()) },
    { re: /\[([^\]\n]+)\]\(<?(https?:\/\/[^\s)>]+)>?\)/y, make: m => link(m[2], parseInline(m[1])) },
    { re: /<(https?:\/\/[^\s>]+)>/y, make: m => link(m[1], m[1]) },
    { re: /https?:\/\/[^\s<]+[^\s<.,:;"')\]!?]/y, make: m => link(m[0], m[0]) },
    { re: /\|\|([\s\S]+?)\|\|/y, make: m => spoiler(parseInline(m[1])) },
    { re: /\*\*\*(?=\S)([\s\S]+?)\*\*\*(?!\*)/y, make: m => wrap("strong", [wrap("em", parseInline(m[1]))]) },
    { re: /\*\*(?=\S)([\s\S]+?)\*\*(?!\*)/y, make: m => wrap("strong", parseInline(m[1])) },
    { re: /__([\s\S]+?)__(?!_)/y, make: m => wrap("u", parseInline(m[1])) },
    { re: /\*(?=\S)([\s\S]*?\S)\*(?!\*)/y, make: m => wrap("em", parseInline(m[1])) },
    { re: /_([\s\S]+?)_(?![A-Za-z0-9_])/y, make: m => wrap("em", parseInline(m[1])), wordStart: true },
    { re: /~~([\s\S]+?)~~/y, make: m => wrap("s", parseInline(m[1])) },
  ];

  function wrap(tag, children) {
    const e = el(tag);
    e.append(...children);
    return e;
  }

  function spoiler(children) {
    const s = wrap("span", children);
    s.className = "spoiler";
    s.tabIndex = 0;
    s.title = "Show spoiler";
    const reveal = () => s.classList.add("shown");
    s.addEventListener("click", reveal);
    s.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") reveal(); });
    return s;
  }

  function parseInline(text) {
    const out = [];
    let buf = "";
    let i = 0;
    const flush = () => { if (buf) { out.push(document.createTextNode(buf)); buf = ""; } };
    outer: while (i < text.length) {
      for (const rule of INLINE) {
        if (rule.wordStart && i > 0 && /[A-Za-z0-9]/.test(text[i - 1])) continue;
        rule.re.lastIndex = i;
        const m = rule.re.exec(text);
        if (m) {
          const end = rule.re.lastIndex;
          flush();
          out.push(rule.make(m));
          i = end;
          continue outer;
        }
      }
      buf += text[i];
      i++;
    }
    flush();
    return out;
  }

  function diffKind(line) {
    if (/^@@ .* @@/.test(line)) return "meta";
    if (/^(Index: |index |={3,}|-{3}|\*{3} |\+{3}|diff --git)/.test(line)) return "comment";
    if (/^[+!]/.test(line)) return "add";
    if (/^-/.test(line)) return "del";
    return "";
  }

  function renderDiff(pre, text) {
    const lines = text.split("\n");
    lines.forEach((line, i) => {
      const k = diffKind(line);
      if (k) pre.appendChild(el("span", k, line));
      else pre.appendChild(document.createTextNode(line));
      if (i < lines.length - 1) pre.appendChild(document.createTextNode("\n"));
    });
  }

  const ANSI_FG = { 30: "#4f545c", 31: "#dc322f", 32: "#859900", 33: "#b58900", 34: "#268bd2", 35: "#d33682", 36: "#2aa198", 37: "#ffffff" };
  const ANSI_BG = { 40: "#002b36", 41: "#cb4b16", 42: "#586e75", 43: "#657b83", 44: "#839496", 45: "#6c71c4", 46: "#93a1a1", 47: "#fdf6e3" };

  function color256(n) {
    if (n < 8) return ANSI_FG[30 + n];
    if (n < 16) return ANSI_FG[30 + n - 8];
    if (n < 232) {
      n -= 16;
      const v = x => (x ? 55 + x * 40 : 0);
      return `rgb(${v(Math.floor(n / 36))}, ${v(Math.floor(n / 6) % 6)}, ${v(n % 6)})`;
    }
    const g = 8 + (n - 232) * 10;
    return `rgb(${g}, ${g}, ${g})`;
  }

  function applySgr(state, params) {
    const p = params.length ? params.split(";").map(Number) : [0];
    for (let i = 0; i < p.length; i++) {
      const c = p[i];
      if (c === 0) { state.fg = state.bg = null; state.bold = state.underline = false; }
      else if (c === 1) state.bold = true;
      else if (c === 4) state.underline = true;
      else if (c === 22) state.bold = false;
      else if (c === 24) state.underline = false;
      else if (c === 39) state.fg = null;
      else if (c === 49) state.bg = null;
      else if (ANSI_FG[c]) state.fg = ANSI_FG[c];
      else if (ANSI_BG[c]) state.bg = ANSI_BG[c];
      else if (c >= 90 && c <= 97) state.fg = ANSI_FG[c - 60];
      else if (c >= 100 && c <= 107) state.bg = ANSI_BG[c - 60];
      else if ((c === 38 || c === 48) && p[i + 1] === 2) {
        const rgb = `rgb(${p[i + 2] || 0}, ${p[i + 3] || 0}, ${p[i + 4] || 0})`;
        if (c === 38) state.fg = rgb; else state.bg = rgb;
        i += 4;
      } else if ((c === 38 || c === 48) && p[i + 1] === 5) {
        const col = color256(p[i + 2] || 0);
        if (c === 38) state.fg = col; else state.bg = col;
        i += 2;
      }
    }
  }

  function renderAnsi(pre, text) {
    const state = { fg: null, bg: null, bold: false, underline: false };
    const re = /\x1b\[([\d;]*)m/g;
    let last = 0, m;
    const push = chunk => {
      if (!chunk) return;
      if (!state.fg && !state.bg && !state.bold && !state.underline) {
        pre.appendChild(document.createTextNode(chunk));
        return;
      }
      const s = el("span", null, chunk);
      if (state.fg) s.style.color = state.fg;
      if (state.bg) s.style.backgroundColor = state.bg;
      if (state.bold) s.style.fontWeight = "700";
      if (state.underline) s.style.textDecoration = "underline";
      pre.appendChild(s);
    };
    while ((m = re.exec(text))) {
      push(text.slice(last, m.index));
      applySgr(state, m[1]);
      last = re.lastIndex;
    }
    push(text.slice(last));
  }

  function renderCode(lang, text) {
    const pre = el("pre", "codeblock");
    const l = (lang || "").toLowerCase();
    if (l === "diff") renderDiff(pre, text);
    else if (l === "ansi") renderAnsi(pre, text);
    else pre.textContent = text;
    return pre;
  }

  const FENCE = /```(?:([a-z0-9_+\-.#]+?)\n)?\n*([\s\S]*?)\n*```/gi;

  function splitFences(text) {
    const parts = [];
    let last = 0, m;
    FENCE.lastIndex = 0;
    while ((m = FENCE.exec(text))) {
      if (m.index > last) parts.push({ type: "text", text: text.slice(last, m.index) });
      parts.push({ type: "code", lang: m[1] || "", text: m[2] });
      last = FENCE.lastIndex;
    }
    if (last < text.length) parts.push({ type: "text", text: text.slice(last) });
    return parts;
  }

  function renderTextBlocks(text, into) {
    const lines = text.split("\n");
    let para = [];
    const flushPara = () => {
      if (!para.length) return;
      const div = el("div", "para");
      div.append(...parseInline(para.join("\n")));
      into.appendChild(div);
      para = [];
    };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let m;
      if (/^>>> /.test(line)) {
        flushPara();
        const q = el("blockquote", "quote");
        renderTextBlocks([line.slice(4), ...lines.slice(i + 1)].join("\n"), q);
        into.appendChild(q);
        return;
      }
      if (/^> |^>$/.test(line)) {
        flushPara();
        const quoted = [];
        while (i < lines.length && /^> |^>$/.test(lines[i])) { quoted.push(lines[i].replace(/^> ?/, "")); i++; }
        i--;
        const q = el("blockquote", "quote");
        renderTextBlocks(quoted.join("\n"), q);
        into.appendChild(q);
      } else if ((m = /^-# (.*)$/.exec(line))) {
        flushPara();
        const sub = el("div", "subtext");
        sub.append(...parseInline(m[1]));
        into.appendChild(sub);
      } else if ((m = /^(#{1,3}) (.+)$/.exec(line))) {
        flushPara();
        const h = el("div", "h" + m[1].length);
        h.append(...parseInline(m[2]));
        into.appendChild(h);
      } else if (/^ *[-*] /.test(line)) {
        flushPara();
        const ul = el("ul", "list");
        while (i < lines.length && (m = /^( *)[-*] (.*)$/.exec(lines[i]))) {
          const li = el("li");
          if (m[1].length >= 2) li.className = "nested";
          li.append(...parseInline(m[2]));
          ul.appendChild(li);
          i++;
        }
        i--;
        into.appendChild(ul);
      } else {
        para.push(line);
      }
    }
    flushPara();
  }

  function renderBody(text, into) {
    const parts = splitFences(text);
    parts.forEach((part, idx) => {
      if (part.type === "code") {
        into.appendChild(renderCode(part.lang, part.text));
        return;
      }
      let t = part.text;
      if (idx > 0 && parts[idx - 1].type === "code") t = t.replace(/^\n/, "");
      if (idx < parts.length - 1 && parts[idx + 1].type === "code") t = t.replace(/\n$/, "");
      if (t.trim() === "") {
        const blanks = (t.match(/\n/g) || []).length;
        if (blanks > 0) into.appendChild(el("div", "gap"));
        return;
      }
      renderTextBlocks(t, into);
    });
  }

  const REPLY = /^> \[Reply to\]\(<?([^)>]*)>?\):\s*(.*)$/;

  function splitReply(text) {
    const lines = text.split("\n");
    const m = REPLY.exec(lines[0] || "");
    if (!m) return { reply: null, body: text };
    const who = m[2].replace(/\s*\(<@[!&]?\d+>\)\s*$/, "").trim();
    let i = 1;
    const snippet = [];
    while (i < lines.length && /^>/.test(lines[i])) { snippet.push(lines[i].replace(/^> ?/, "")); i++; }
    return { reply: { who, url: m[1], snippet: snippet.join(" ") }, body: lines.slice(i).join("\n") };
  }

  function cleanSnippet(s) {
    return s
      .replace(/\x1b\[[\d;]*m/g, "")
      .replace(/```[a-z0-9_+\-.#]*/gi, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function renderMessage(number, text) {
    const row = el("article", "msg dc");
    row.id = "msg-" + number;
    const { reply, body } = splitReply(text || "");

    if (reply) {
      const r = el("div", "reply");
      const who = el("span", "reply-who", reply.who || "unknown");
      const snip = el("span", "reply-snippet");
      snip.append(...parseInline(cleanSnippet(reply.snippet)));
      r.append(who, " ", snip);
      row.appendChild(r);
    }

    const num = el("a", "num", String(number));
    num.href = "#msg-" + number;
    num.title = "Message " + number;
    row.appendChild(num);

    const content = el("div", "content");
    const trimmed = body.replace(/^\s+|\s+$/g, "");
    if (trimmed) renderBody(trimmed, content);
    else content.appendChild(el("div", "empty", "No text archived. This was probably an image, sticker or embed."));
    row.appendChild(content);
    return row;
  }

  function renderChannel(name, messages, container) {
    container.textContent = "";
    const numbers = Object.keys(messages).map(Number).filter(n => !Number.isNaN(n)).sort((a, b) => a - b);
    for (const n of numbers) container.appendChild(renderMessage(n, messages[String(n)]));
    return numbers.length;
  }

  return { renderChannel, renderMessage, renderBody, parseInline, renderCode, splitFences, splitReply };
})();
</script>

        { id: "abilities", file: "Abilities.txt", body: `
          <div class="h">Strengths</div>
          <div class="item"><b>[+] Quick thinking</b><span class="d">When something urgent comes up, Pico can quickly offer or carry out a good solution.</span></div>
          <div class="item"><b>[+] Advanced neural network</b><span class="d">As a first prototype from before the mass-produced drones, his logic works differently. He changes his approach to fit each obstacle, learns from every attempt, and picks up skills quickly.</span></div>
          <div class="item"><b>[+] Technical mind</b><span class="d">He landed with some built-in knowledge of his own inner workings and self-repair, which gives him useful latent knowledge of electronics and components.</span></div>

          <div class="h">Backstory | Pico's POV</div>
          <div class="pov">
            <p>I am an experimental robot. I was one of the first robots ever sent out to Copper-9, and am probably the only one of that generation still online today. I have been online for approximately 5 years.</p>
            <p>My form possesses absolutely nothing besides a mechanical body of weak servos, outer plates, and steel sinew.</p>
            <p>I was here before the production models, and the colonies and societies they formed. I was able to see the lonely, abandoned city in all its frigid goodness.</p>
            <p>I was given no explicit purpose, besides one word in my contextual knowledge, which seemed like some sort of order: “live”.<br>How peculiar.</p>

        { id: "equipment", file: "Equipment.txt", body: `
          <div class="h">Equipment</div>
          <div class="item"><b>[+] High-voltage focused electron beams</b><span class="d">One in each forearm, built with materials from two old CRT televisions. They can pierce through almost all types of armor because of the nature of the projectile. Electrons are massless, charged particles. They stun enemies for a short period of time <br><span class="warn">(Roll a 6-sided die. If the dice rolls from 1-5, the enemy is stunned for a few seconds and their most recent action is cancelled. 1-2 allows Pico to close in and attack once, and 3-5 allows Pico to close in and attack twice or some other long action. 6 stuns the opponent for the entire turn).</span><br>The reason this is a guaranteed hit mechanic and not a probability mechanic is that Pico is a robot, with robotic levels of precision, and it would be very hard for him to miss. Additionally, electron beams are impossible to dodge, because they are virtually invisible and travel anywhere from 0.3x to 0.9x the speed of light.</span></div>
          <div class="item"><b>[+] Diamond-tipped claws</b><span class="d">Machined from tungsten carbide.</span></div>
          <div class="item"><b>[+] Scramjets</b><span class="d">Wings removed in favor of scramjets fed by an inbuilt fuel reserve. Small servos tilt the thrusters to fine-tune pitch, yaw and roll.</span></div>
          <div class="item"><b>[+] Custom RGB visor display and microcontroller</b><span class="d">He can change his eye color, for some reason.</span></div>
          <div class="item"><b>[+] Upgraded logic chip and memory</b><span class="d">Plus a marginally higher clock speed.</span></div>
          <div class="item"><b>[+] Converted oil system</b><span class="d">Works with many types of oil and grease. Power now comes from a recharging system, so oil mainly handles internal lubrication and cooling. In an emergency, oil can still work as a power source.</span></div>
          <div class="item"><b>[+] PWM microcontroller and radio</b><span class="d">An inbuilt radio transmitter and receiver with his own proprietary data protocol. He can slide into your DMs from over yonder and anywhere.</span></div>
          <div class="item"><b>[+] Steel cables and heavy-duty servos</b><span class="d">Built to handle high loads.</span></div>
          <div class="item"><b>[+] Power supply</b><span class="d">With all the power this setup eats, Pico has a power supply to match. It makes sense for this era of the universe.</span></div>` },
        { id: "abilities", file: "Abilities.txt", body: `
          <div class="h">Abilities</div>
          <div class="item"><b>[+] Sandevistan</b><span class="d">A self-made chip in his head, near his logic chips. It severely overclocks his hardware, so he can think, move and react several times faster than normal. And he already moves pretty fast.</span></div>
          <div class="item"><b>[+] Electron beams</b><span class="d">The beam in each arm does electrical damage depending on how well the target can deflect or sustain it. Most drones can't, especially at the amount Pico puts out. Tiny servos on each lens fine-tune the beam's path so he can hit weak spots. They stun enemies for a short period of time <br><span class="warn">(Roll a 6-sided die. If the dice rolls from 1-5, the enemy is stunned for a few seconds and their most recent action is cancelled. 1-2 allows Pico to close in and attack once, and 3-5 allows Pico to close in and attack twice or some other long action. 6 stuns the opponent for the entire turn).</span><br>The reason this is a guaranteed hit mechanic and not a probability mechanic is that Pico is a robot, with robotic levels of precision, and it would be very hard for him to miss. Additionally, electron beams are impossible to dodge, because they are virtually invisible and travel anywhere from 0.3x to 0.9x the speed of light.</span></div>

          <div class="item"><b>[+] Technical mind</b><span class="d">He can build, mod and improve himself, and possibly companions.</span></div>
          <div class="item"><b>[+] A little resistant to incoming electron beams</b><span class="d">A result of his own idiocy. He supposedly messed around and found out.</span></div>

          </div>
          <div class="h">Weaknesses</div>
          <div class="item bad"><b>[-] Overthinking</b><span class="d">His sanity has a limit. If an opponent keeps him anticipating and guessing for too long, he gets over-paranoid and dives into deep analysis of what they could do and what will happen next, like a high-rated chess engine. His responses slow down, and sometimes he has to take a compromise because he was busy thinking instead of doing. He once had to take one of Null's hits because he was too busy taking in Arabella's situation at the same time.</span></div>
          <div class="item bad"><b>[-] Heat</b><span class="d">He has no idea how to make his structure more resistant to high-temperature attacks. His outer frame is a tungsten carbide derivative coated in a non-conductive material.</span></div>
          <div class="item bad"><b>[-] Self-inflicted strain</b><span class="d">Some of his attacks put incredible stress on his body and can exceed the rated tension of his cables, even with the steel cables and new servos. If he dropkicks an opponent and tries to annihilate them in that one strike, he can end up with "super arthritis": serious servo and joint damage.</span></div>` },
        { id: "lore", file: "Lore.txt", body: `
          <div class="h">Current lore</div>
          <div class="pov">
            <p>Right now, Pico runs a workshop in the abandoned city, in the corner of an intersection between two streets. At first glance, it's a garage door with lots of graffiti. At second glance, there's music coming from it, and lots of lights bleeding through from the gap between the door and the street.</p>
            <p>Once you enter, you'll see tons of skateboards hung up, an old boombox hooked up to a computer most likely playing Alice In Chains, Creed, or Staind, and several boxes of high-end hardware. There's one bright red mechanic's cabinet, the drawers labeled with masking tape: "HARDWARE" "CUSTOM" "PROJECTS" "SANDEVISTAN DEVELOPMENT"</p>
            <p>And then you'll see the custom visors with RGB graphics and various glowing drone parts on one table.</p>
            <p>And then you'll see Pico himself, with a red display under his visor, most likely welding something. He'll notice someone new has entered and he'll wave vigorously at you.</p>
            <p>Occasionally, drones from surrounding colonies drop by and ask him for something, whether it be some sort of resource or even a repair job. Pico doesn't get guests or customers often, but he loves it when he does.</p>
            <p>Pico has made an oil recycling machine for him, Arabella, and his customers. Pico finds oil in the city, like car or machine oil, and collects it, putting it in the machine. It takes a few hours for five liters to produce, depending on how pure the oil is and how much work is needed to purify it.</p>
            <p>The machine employs multiple steps of filtration and chemical processing until the final result is an ethical version of the very same, delicious oil that’s usually obtained from drones.</p>
            <p><span class="dim">This is only for lore and has no real effect in his writing. Pico doesn't really consume that much oil, and it's not for energy.</p>
          </div>
          <div class="h">Backstory | Pico's POV</div>
          <div class="pov">
            <p>My story started, like many others, as an experimental drone. I was one of the first ones out there, the only one of that generation still online today.</p>
            <p>I was given no explicit purpose, besides a mission of one word: “live”.<br>How peculiar.</p>
            <p>I wandered on this desolate, abandoned planet, as a weak robot, knowing nothing with given only minimal hardware, a self-aware and self-governing AI, and some cat-like instincts.</p>
            <p>As I discovered colonies and other things, I was taken in by a small family.</p>
            <p>......soon watched that family get disassembled by a group of three yellow-eyed drones.</p>
            <p>.. began to hate myself. Hate the cage I was trapped in, the frail mechanical limbs which bound my soul. I wished I could have done something.</p>
            <p>As years passed, I watched everyone I’d grown to know drop off from one cause or the other, whether a disaster or a disassembly drone.</p>
            <p>At the end of the day, I was as lost as I was when I had begun. I wanted only one thing: closure, or resolution, which I thought could only be achieved with death.</p>
            <p><b>But!</b> Death was the only thing I could not have! My objective is “live”, so at all costs I can’t die!</p>
            <p>What is there left for me to do?</p>
            <p>Exploring and wandering. I stay in a skyscraper, in the snowy abandoned city.</p>
            <p>I learnt about machinery and drone systems. I experimented on myself, modded myself, made myself as good as I could be with the materials available. I’m still a robot.</p>
            <p>Even today, I roam the snowy streets. Although, for some reason, I hate a little bit less now. Now, instead of dreading every day, I just walk the streets and look up at the sky.</p>
            <p>I’ve accepted the permanence in my solitude. I’ve accepted I probably won’t be able to even exit the orbit of Copper-9. I’ve accepted I am stuck here with all the colonies. It’s okay. I’ll just look at the stars and dream on. I was at least allowed to dream.</p>
            <p>Sometimes, when there’s a new adversary, I study them from a distance to learn how they work, and gauge if they’re a threat. I haven’t had to fight any major forces recently, but there have been a few formidable drones here and there that have come after me.</p>
            <p>..........</p>
            <p>At least my hideout has Christmas lights.</p>
          </div>` },

  async function fetchArchive() {

      if (!res.ok) throw new Error("raw " + res.status);
      return { data: await res.json(), from: "github @ " + sha.slice(0, 7) };
    } catch (e) {
      const res = await fetch(ARCHIVE_PATH + "?t=" + Date.now());

  function archiveMessages(data) {

    const first = values.find(v => v && typeof v === "object" && !Array.isArray(v));
    if (first) return first;
    throw new Error("no messages found in archive");
  }

  async function loadArchive() {

  const music = new Audio("track.mp3");

    if (over <= 1) return;

    plCover.innerHTML = '<span aria-hidden="true">♪</span>';
    const img = new Image();
    img.alt = song.album ? song.album + " cover" : song.title + " cover";
    img.onload = () => { plCover.innerHTML = ""; plCover.appendChild(img); };
    img.src = song.cover;

  }
  const playerEl = document.getElementById("player");

  plCover.addEventListener("click", () => setArt(true));

  plArt.addEventListener("click", () => setArt(false));
  plCover.addEventListener("transitionend", e => { if (e.propertyName === "width") refitAll(); });
  try { const v = parseFloat(localStorage.getItem("pico-vol")); if (v >= 0 && v <= 1) plVol.value = v; } catch (e) {}
  const showVol = () => plVol.style.setProperty("--v", plVol.value * 100 + "%");
  music.volume = +plVol.value;
  showVol();
  let fadeTimer = 0;
  function fadeIn(ms = 2500) {

    const t0 = performance.now();
    music.volume = 0;
    fadeTimer = setInterval(() => {

      music.volume = +plVol.value * k * k;

    }, 30);
  }
  music.addEventListener("play", () => fadeIn());
  plVol.addEventListener("input", () => {
    clearInterval(fadeTimer);
    music.volume = +plVol.value;
    showVol();

  });
  const isMusicToggle = e => !!e && ((e.target && e.target.closest && e.target.closest("#opt-music, #pl-skip")) ||
    (e.type === "keydown" && e.key === " " && (mode === "menu" || mode === "section")) ||

  music.addEventListener("play", syncMusicBtn);

      if (e.key === "ArrowDown") { e.preventDefault(); setSel(sel + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setSel(sel - 1); }
      else if (e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); btns[sel] && btns[sel]._act(); }
      else if (e.key === " ") { e.preventDefault(); toggleMusic(); }
      else if (/^[1-9]$/.test(e.key) && +e.key <= P().sections.length) { openSection(+e.key - 1); }
    } else if (mode === "section") {
      if (e.key === "ArrowDown") { e.preventDefault(); setOpt(opt + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setOpt(opt - 1); }
      else if (e.key === "Enter") { e.preventDefault(); opt === 1 ? toggleMusic() : goBack(); }
      else if (e.key === " ") { e.preventDefault(); toggleMusic(); }
      else if (e.key === "Escape" || e.key === "Backspace" || e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
    }
  });
  screen.addEventListener("click", e => { if (!e.target.closest("button,a,img")) screen.focus({ preventScroll: true }); });
  function gate() {
    mode = "gate";
    screen.innerHTML = "";
    line('press any key to boot<span class="blink-us">_</span>');
    const go = e => {
      if (mode !== "gate") return;
      if (e.target.closest && e.target.closest("#player")) return;
      if (e.type === "keydown" && ["Shift", "Control", "Alt", "Meta", "Tab"].includes(e.key)) return;
      if (e.type === "keydown") e.preventDefault();
      document.removeEventListener("keydown", go);
      document.removeEventListener("pointerdown", go);
      document.getElementById("player").hidden = false;
      setTimeout(syncSkip, 0);
      refitAll();
      boot(true);
    };
    document.addEventListener("keydown", go);
    document.addEventListener("pointerdown", go);
    screen.focus({ preventScroll: true });
  }
  gate();
})();
</script>
